<style>
:root{
  --bg:#f4f2ec;--surface:#ffffff;--ink:#16181a;--muted:#6b6f72;--line:#e4e1d8;
  --accent:#1c4a38;--on-accent:#ffffff;--accent-text:#1c4a38;--accent-soft:#e6f0ea;
  --neg:#a8381a;--warn-bg:#fbf3dd;--warn:#7a5a12;
  --t-debt:#1f8a5b;--t-own:#2f66d0;--t-ovdp:#d4731a;--t-fx:#7c4fd0;--t-sys:#8a8c8d;--t-mom:#c2417a;
  --nav-bg:rgb(244 242 236/.94);--toast-bg:#16181a;--toast-fg:#fff;
  --radius:16px;--shadow:0 1px 0 rgb(0 0 0/.02);
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#0a0b0b;--surface:#141616;--ink:#ecebe6;--muted:#9a9d9b;--line:#262a29;
  --accent:#2c7a5a;--on-accent:#ffffff;--accent-text:#6fd0a2;--accent-soft:#10251c;
  --neg:#ee8d6d;--warn-bg:#241f12;--warn:#d9b25a;
  --t-debt:#4fcf97;--t-own:#6b9cff;--t-ovdp:#f0a04b;--t-fx:#a98aff;--t-sys:#9a9d9b;--t-mom:#f08ab8;
  --nav-bg:rgb(10 11 11/.94);--toast-bg:#2b2f2e;--toast-fg:#ecebe6;
  --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default;opacity:.4}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
[hidden]{display:none!important}

.wrap{max-width:640px;margin:0 auto;padding:0 16px 56px}
@media (min-width:800px){.wrap{max-width:780px}}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;flex:none}
.logo svg{width:18px;height:18px}
.title{font-size:19px;font-weight:800;letter-spacing:-.01em;margin:0}
.head-actions{display:flex;gap:8px;align-items:center}
.chip{height:38px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 13px;font-size:13px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.chip.round{width:38px;padding:0}
.chip svg{width:17px;height:17px}
.r-short{display:none}

nav.tabs{position:sticky;top:0;z-index:20;margin:0 -16px 18px;padding:0 8px;background:var(--nav-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{height:46px;border:0;background:none;font-size:13px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent}
nav.tabs button[aria-current=page]{color:var(--accent-text);border-bottom-color:var(--accent-text)}

.stack{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card.main{border-top:3px solid var(--accent)}
.card h2{font-size:15px;margin:0}
.cap{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.big{font-size:clamp(30px,9vw,42px);font-weight:800;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.08;margin-top:6px;overflow-wrap:anywhere}
.mid{font-size:clamp(25px,7vw,32px)}
.sub{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--accent-text)}.neg{color:var(--neg)}
.chk{font-size:12px;color:var(--muted);margin-top:2px}
.chk.stale{color:var(--warn)}

.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{height:42px;padding:0 15px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13.5px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--neg)}
.btn.grow{flex:1}
.btn.sm{height:34px;padding:0 12px;font-size:13px}
.btn.wide{width:100%}
.actions>.btn{flex:1 1 0;min-width:0;padding:0 8px;white-space:nowrap}
.linkbtn{border:0;background:none;color:var(--accent-text);font-weight:700;font-size:13.5px;height:38px;padding:0 2px}

.split{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.rows{margin-top:14px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.row b{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.row b .sub{display:block;font-weight:500;margin-top:0}

.subacc{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.subacc .head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.subacc .nm{font-weight:700}
.subacc .amt{font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.subacc .actions{margin-top:10px}
.subacc .actions .btn{height:36px;font-size:13px}

.expected{opacity:.6;margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}

.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;height:32px;border:0;border-radius:999px;background:none;font-weight:700;font-size:12.5px;color:var(--muted);white-space:nowrap;padding:0 12px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}

.btn.xfer{width:100%;height:46px}
.pair{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:760px){.pair{grid-template-columns:1fr 1fr}}
.debtacts>.btn:first-child{flex:1 1 100%}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--t-debt);margin-left:8px;vertical-align:middle}
.sdot.syncing{background:var(--t-ovdp)}.sdot.error{background:var(--neg)}.sdot.offline{background:var(--t-sys)}
details summary{list-style:revert}

input,select,textarea{height:44px;width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:0 12px;font-size:16px}
textarea{height:auto;padding:10px 12px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{border-color:var(--accent-text)}
.field{display:grid;gap:6px;font-size:12.5px;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12.5px;color:var(--muted);margin:0}

dialog{border:0;border-radius:20px;padding:0;width:calc(100% - 24px);max-width:440px;background:var(--surface);color:var(--ink);box-shadow:0 30px 80px -20px rgb(0 0 0/.55);max-height:calc(100dvh - 24px);overflow:auto;overscroll-behavior:contain}
dialog::backdrop{background:rgb(0 0 0/.55)}
.dlg{padding:20px;display:grid;gap:14px}
.dlg h2{margin:0;font-size:18px}
.form{display:grid;gap:14px}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end}
.dlg-actions .btn{flex:1}
.preview{background:var(--bg);border-radius:11px;padding:10px 12px;font-size:13.5px;font-variant-numeric:tabular-nums;display:grid;gap:2px;min-height:40px}
.lrow{display:grid;grid-template-columns:1.2fr 1fr 36px;gap:6px;margin-bottom:6px}
.lrow input[name=lq]{grid-column:1/3}
.lrow .icon{width:36px;height:44px;border:0;background:none;color:var(--muted);font-size:22px}

.banner{background:var(--warn-bg);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px;font-size:14px;color:var(--ink)}
.banner .row2{display:flex;gap:8px;flex-wrap:wrap}
.foot{text-align:center;font-size:12px;color:var(--muted);padding:4px 8px}

/* Журнал */
.t-mom{--c:var(--t-mom)}.t-debt{--c:var(--t-debt)}.t-own{--c:var(--t-own)}.t-ovdp{--c:var(--t-ovdp)}.t-fx{--c:var(--t-fx)}.t-sys{--c:var(--t-sys)}
.dot::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.fchip{flex:none;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:13px;font-weight:700}
.fchip .n{color:var(--muted);font-weight:600;margin-left:5px}
.fchip[aria-pressed=true]{border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 15%,var(--surface))}
.fchip.all[aria-pressed=true]{--c:var(--accent)}
.search{height:40px}
.jl{list-style:none;margin:0;padding:0}
.dh{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:16px 2px 8px}
.ent{display:grid;grid-template-columns:4px minmax(0,1fr);width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:0;overflow:hidden;margin-bottom:8px}
.ent .bar{background:var(--c)}
.ent .body{padding:11px 14px 11px 12px;min-width:0}
.ent .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ent .ti{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.ent .tg{font-size:11.5px;font-weight:700;color:var(--c);margin-top:2px}
.ent .tg .arch{color:var(--muted);font-weight:600;margin-left:6px}
.ent .nt{font-size:12.5px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere;white-space:pre-line}
.lns{margin-top:6px;display:grid;gap:2px}
.ln{display:flex;gap:8px;justify-content:space-between;align-items:baseline;font-size:13px;font-variant-numeric:tabular-nums}
.ln .nm{color:var(--muted)}
.ln b{white-space:nowrap}
.ln .aft{display:block;text-align:right;font-weight:500;font-size:11.5px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:14px 0}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-top:14px}
.mgrid div{font-size:13px;display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:8px;font-variant-numeric:tabular-nums}
.mgrid span{color:var(--muted)}

/* Калькулятор */
.qk{display:flex;gap:6px;flex-wrap:wrap}
.qk button{height:34px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 12px;font-weight:700;font-size:13px}
.eq{display:grid;place-items:center;color:var(--muted);font-size:18px;height:20px}
.legend{display:grid;gap:8px;margin-top:10px}
.legend div{font-size:13.5px}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-fg);border-radius:13px;padding:6px 8px 6px 16px;display:flex;align-items:center;gap:12px;font-size:14px;max-width:calc(100% - 24px);z-index:50;box-shadow:0 12px 30px -10px rgb(0 0 0/.5)}
#toast button{border:0;background:rgb(127 127 127/.28);color:inherit;border-radius:9px;height:34px;padding:0 12px;font-weight:700}

@media (max-width:700px){
  nav.tabs{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0;padding:0 4px env(safe-area-inset-bottom);border-bottom:0;border-top:1px solid var(--line);z-index:30}
  nav.tabs button{height:58px;font-size:12px}
  nav.tabs button[aria-current=page]{border-bottom-color:transparent;box-shadow:inset 0 3px 0 var(--accent-text)}
  .wrap{padding-top:env(safe-area-inset-top);padding-bottom:calc(92px + env(safe-area-inset-bottom));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  #toast{bottom:calc(74px + env(safe-area-inset-bottom))}
}
@media (max-width:560px){
  dialog{width:100%;max-width:none;margin:auto 0 0;border-radius:20px 20px 0 0;max-height:92dvh}
  .dlg{padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
}
@media (max-width:440px){
  .u-text,.r-long{display:none}
  .r-short{display:inline}
  .chip{padding:0 11px}
  .card{padding:18px 16px}
  .actions>.btn{font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

<script>
(() => {
'use strict';

/* ═════════ Константи ═════════ */
const KEY = 'kasa-v3', UNDO_KEY = 'kasa-v3-undo', OLD_KEY = 'kasa-v2', SNOOZE_KEY = 'kasa-snooze';
const ACCS = {
  cash: { id: 'cash', name: 'Готівка', cur: 'UAH' },
  card: { id: 'card', name: 'Карта', cur: 'UAH' },
  usd:  { id: 'usd',  name: 'Долари', cur: 'USD' },
  ovdp: { id: 'ovdp', name: 'ОВДП', cur: 'UAH' },
  debt: { id: 'debt', name: 'Борг тата', cur: 'USD' },
  debtm: { id: 'debtm', name: 'Борг мами', cur: 'USD' },
};
const ACC_ORDER = ['cash', 'card', 'usd', 'ovdp', 'debt', 'debtm'];
const TAGS = [
  { id: 'debt', name: 'Тато / Борг тата', short: 'Тато' },
  { id: 'mom',  name: 'Мама / Борг мами', short: 'Мама' },
  { id: 'own',  name: 'Власні (карта, готівка, $)', short: 'Власні' },
  { id: 'ovdp', name: 'ОВДП / Інвестиції', short: 'ОВДП' },
  { id: 'fx',   name: 'Валютообмін', short: 'Обмін' },
  { id: 'sys',  name: 'Службові / Коригування', short: 'Службові' },
];
const TAG_BY = Object.fromEntries(TAGS.map(t => [t.id, t]));
const DEBTORS = {
  debt:  { acc: 'debt',  tag: 'debt', cap: 'Дебіторка · Борг тата', dlg: 'Борг тата',  in: 'Тато повернув',   titleIn: 'Тато повернув',   titleOut: 'Позичено татові' },
  debtm: { acc: 'debtm', tag: 'mom',  cap: 'Дебіторка · Борг мами', dlg: 'Борг мами', in: 'Мама повернула', titleIn: 'Мама повернула', titleOut: 'Позичено мамі' },
};
const MONTHS_NOM = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
const MONTHS_GEN = ['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const TABS = [['home', 'Головна'], ['jrnl', 'Журнал'], ['calc', 'Калькулятор'], ['more', 'Ще']];
const DAY = 86400000;

/* ═════════ Гроші: тільки цілі числа (копійки / центи) ═════════ */
const sym = c => c === 'USD' ? '$' : 'грн';
const divRound = (n, d) => { const neg = (n < 0) !== (d < 0); n = Math.abs(n); d = Math.abs(d); const q = Math.floor((2 * n + d) / (2 * d)); return neg ? -q : q; };
function parseScaled(raw, scale, allowNeg = false) {
  const s = String(raw ?? '').replace(/[\s\u00a0\u202f]/g, '').replace(',', '.');
  if (!s) return null;
  const m = /^([+-]?)(\d*)(?:\.(\d*))?$/.exec(s);
  if (!m) return null;
  const sign = m[1] === '-' ? -1 : 1, ip = m[2] || '', fp = m[3] || '';
  if (!ip && !fp) return null;
  if (sign < 0 && !allowNeg) return null;
  if (ip.length > 12) return null;
  const pow = 10 ** scale;
  const frac = (fp + '0'.repeat(scale + 1)).slice(0, scale + 1);
  const v = Number(ip || 0) * pow + Number(frac.slice(0, scale) || 0) + (Number(frac[scale]) >= 5 ? 1 : 0);
  return sign * v;
}
const pm = (raw, neg = false) => parseScaled(raw, 2, neg);          // гроші → мінімальні одиниці
const prate = raw => parseScaled(raw, 4);                          // курс → ×10000
const grp = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0');
function fmt(n, cur, o = {}) {
  const neg = n < 0, a = Math.abs(n), w = Math.floor(a / 100), f = a % 100;
  const body = grp(w) + (f ? ',' + String(f).padStart(2, '0') : '');
  const s = cur === 'USD' ? '$' + body : body + '\u00a0грн';
  return (neg ? '−' : (o.plus && n > 0 ? '+' : '')) + s;
}
function plain(n) { const a = Math.abs(n), w = Math.floor(a / 100), f = a % 100; return (n < 0 ? '-' : '') + w + (f ? ',' + String(f).padStart(2, '0') : ''); }
function rateStr(r) { const w = Math.floor(r / 10000); let f = String(r % 10000).padStart(4, '0').replace(/0+$/, ''); if (f.length < 2) f = f.padEnd(2, '0'); return w + ',' + f; }
const u2k = (c, r) => divRound(c * r, 10000);                      // центи → копійки
const k2u = (k, r) => divRound(k * 10000, r);                      // копійки → центи
const convert = (amt, from, to, r) => from === to ? amt : (from === 'USD' ? u2k(amt, r) : k2u(amt, r));

/* Точний калькулятор виразів (дроби BigInt): 40000/45,69 */
function evalExpr(src) {
  const s = String(src).replace(/[\s\u00a0]/g, '').replace(/,/g, '.').replace(/[×·]/g, '*').replace(/[÷:]/g, '/');
  if (!s || /[^0-9.+\-*/()]/.test(s)) return null;
  const gcd = (a, b) => { a = a < 0n ? -a : a; b = b < 0n ? -b : b; while (b) [a, b] = [b, a % b]; return a || 1n; };
  const R = (n, d = 1n) => { if (d < 0n) { n = -n; d = -d; } const g = gcd(n, d); return { n: n / g, d: d / g }; };
  let i = 0;
  const peek = () => s[i];
  function num() {
    let t = '';
    while (i < s.length && /[0-9.]/.test(s[i])) t += s[i++];
    if (!t || (t.match(/\./g) || []).length > 1 || t === '.') throw 0;
    const [ip, fp = ''] = t.split('.');
    return R(BigInt((ip || '0') + fp), 10n ** BigInt(fp.length));
  }
  function prim() {
    if (peek() === '(') { i++; const v = expr(); if (peek() !== ')') throw 0; i++; return v; }
    return num();
  }
  function unary() { if (peek() === '-') { i++; const v = unary(); return R(-v.n, v.d); } if (peek() === '+') { i++; return unary(); } return prim(); }
  function term() {
    let v = unary();
    while (peek() === '*' || peek() === '/') {
      const op = s[i++], b = unary();
      if (op === '*') v = R(v.n * b.n, v.d * b.d); else { if (b.n === 0n) throw 0; v = R(v.n * b.d, v.d * b.n); }
    }
    return v;
  }
  function expr() {
    let v = term();
    while (peek() === '+' || peek() === '-') {

function migrateV2(o) {
  const T0 = o.updatedAt || now();

  const day0 = dateOfTs(T0);
  const S0 = blankState();

  const A = r => (o.accounts || []).find(a => a.role === r);
  const E = [];

  const card = A('card'), usd = A('usd'), ov = A('ovdp'), debt = A('debt');
  if (card && M(card.amount)) push('open-card', { kind: 'open', tag: 'sys', title: 'Початковий баланс · Карта', note: 'Перенесено зі старої версії', lines: [{ a: 'card', d: M(card.amount) }] });
  if (usd && M(usd.amount)) push('open-usd', { kind: 'open', tag: 'sys', title: 'Початковий баланс · Долари', note: 'Перенесено зі старої версії', lines: [{ a: 'usd', d: M(usd.amount) }] });
  if (ov) {
    const qty = Math.round(Number(ov.quantity) || 0);
    S0.coupon = M(ov.annualYieldUah);
    const val = qty ? qty * S0.nominal : u2k(M(ov.amount), rateI);
    if (val || qty) push('open-ovdp', { kind: 'open', tag: 'ovdp', title: 'Початковий баланс · ОВДП', note: qty ? `${qty} шт × ${fmt(S0.nominal, 'UAH')} (номінал)` : 'Перенесено зі старої версії', lines: [{ a: 'ovdp', d: val, q: qty }] });
  }
  const debtNow = M(debt && debt.amount);
  const dd = (o.drafts || [])[0];
  if (dd) {
    const startC = dd.startCur === 'UAH' ? k2u(M(dd.startAmount), rateI) : M(dd.startAmount);
    const ents = dd.entries || [];
    const first = ents.map(e => e.date).filter(Boolean).sort()[0] || day0;
    let sum = startC;
    push('debt-open', { kind: 'open', tag: 'debt', title: 'Борг за домовленістю', note: 'Початкова сума боргу', date: first, ts: T0 - 1000, lines: [{ a: 'debt', d: startC }] });
    ents.forEach((e, idx) => {
      const r = dd.useCurrent ? rateI : Math.round((Number(e.rate) || o.rate) * 10000);
      const amt = M(e.amount), cu = e.cur === 'USD' ? 'USD' : 'UAH';
      const usdC = cu === 'USD' ? amt : k2u(amt, r);
      const d = e.kind === 'out' ? usdC : -usdC;
      sum += d;
      const route = e.from && e.to ? `${e.from} → ${e.to}` : (e.from || e.to || '');
      push('debt-' + e.id, { kind: 'debt', tag: 'debt', title: e.title || (e.kind === 'out' ? 'Позичено ще' : 'Повернення боргу'),
        note: [`${fmt(amt, cu)} · курс ${rateStr(r)}`, route, e.purpose, 'зарахування вже враховано у балансі'].filter(Boolean).join(' · '),
        date: e.date || day0, ts: T0 - 900 + idx, lines: [{ a: 'debt', d }], meta: { amt, cur: cu, rate: r } });
    });
    const diff = debtNow - sum;
    if (diff) push('debt-fix', { kind: 'adjust', tag: 'debt', title: 'Звірка з балансом на головній', note: 'Різниця між чернеткою і головним екраном', ts: T0 - 500, lines: [{ a: 'debt', d: diff }] });
  } else if (debtNow) {
    push('open-debt', { kind: 'open', tag: 'debt', title: 'Початковий баланс · Борг тата', lines: [{ a: 'debt', d: debtNow }] });
  }
  const CAT = { salary: 'Зарплата', 'invest-income': 'Інвестиції', refund: 'Повернення', 'other-in': 'Інше', food: 'Їжа', home: 'Житло', transport: 'Транспорт', docs: 'Документи', tech: 'Техніка', health: "Здоров'я", 'other-out': 'Інше' };
  const used = new Set();
  (o.transactions || []).forEach(t => {
    const dup = (o.log || []).find(l => !used.has(l.id) && t.title && String(l.text).includes(t.title) && Math.abs(Date.parse(dateOfTs(l.ts)) - Date.parse(t.date)) <= DAY * 1.1);
    if (dup) used.add(dup.id);

      note: [CAT[t.categoryId] ? 'Категорія: ' + CAT[t.categoryId] : '', dup ? dup.text : ''].filter(Boolean).join(' · '),
      date: t.date, ts: dup ? dup.ts : T0 - 2000, meta: { amt: M(t.amount), cur: t.currency === 'USD' ? 'USD' : 'UAH' }, archive: true });
  });
  const tagOf = x => /^Переказ/.test(x) ? 'fx' : /Борг|тата|татові|Тато/.test(x) ? 'debt' : /ОВДП/.test(x) ? 'ovdp' : /^(Вручну виправлено|Оновлено|Курс|Імпортовано|Скидання)/.test(x) ? 'sys' : 'own';
  (o.log || []).filter(l => !used.has(l.id)).forEach(l => push('log-' + l.id, { kind: 'archive', tag: tagOf(String(l.text)), title: String(l.text), date: dateOfTs(l.ts), ts: l.ts, archive: true }));
  if (o.land && (o.land.parts || []).length) {
    push('land', { kind: 'archive', tag: 'sys', title: 'Земля (архів): ' + (o.land.name || ''), archive: true, ts: T0 - 3000,
      note: o.land.parts.map(p => `${p.name}: $${p.amountUsd}${p.inTotal ? '' : ' на рік'}`).join('; ') });

  (o.drafts || []).slice(1).forEach((d, i) => push('draft-' + (d.id || i), { kind: 'archive', tag: 'sys', title: 'Чернетка (архів): ' + d.name, archive: true, ts: T0 - 3100 - i,
    note: `Початково ${d.startAmount} ${d.startCur}; записів: ${(d.entries || []).length}` }));

}

/* повна заміна даних (імпорт «Замінити», очищення): зникле стає «видаленим», щоб хмара не повернула його */
function replaceWith(s, B) {

  for (const e of s.entries) if (!keep.has(e.id)) tomb[e.id] = t;
  const entries = B.entries.map(e => ({ ...e, upd: Math.max(e.upd, t + 1) }));

}
const mkEntry = p => { const t = now(); return { id: uid(), upd: t, ts: t, date: today(), kind: 'note', tag: 'sys', title: '', note: '', lines: [], ...p }; };
const addEntry = (s, p) => { const e = mkEntry(p); s.entries.push(e); return e; };

/* Об'єднання двох станів (для синхронізації ПК ↔ телефон) */
function mergeStates(A, B) {
  const out = JSON.parse(JSON.stringify(A));
  for (const [id, t] of Object.entries(B.tomb || {})) out.tomb[id] = Math.max(out.tomb[id] || 0, t);
  const map = new Map(out.entries.map(e => [e.id, e]));
  for (const e of B.entries) { const c = map.get(e.id); if (!c || e.upd > c.upd) map.set(e.id, JSON.parse(JSON.stringify(e))); }
  for (const [id, t] of Object.entries(out.tomb)) { const e = map.get(id); if (e && e.upd <= t) map.delete(id); }
  out.entries = [...map.values()];
  if ((B.supd || 0) > (A.supd || 0)) { for (const k of ['rate', 'display', 'nominal', 'coupon', 'calcRate']) out[k] = B[k]; out.supd = B.supd; }
  out.checked = { ...B.checked, ...A.checked };
  for (const k of Object.keys(B.checked || {})) out.checked[k] = Math.max(A.checked?.[k] || 0, B.checked[k]);

}

  for (const [id, t] of Object.entries(B.tomb || {})) { const c = have.get(id); if (c && c.upd <= t) removed++; }

function calcSync(source) {
  const r = S.calcRate, c = ui.calc;
  const usdIn = $('[data-calc=usd]'), uahIn = $('[data-calc=uah]');
  if (!usdIn || !uahIn) return;
  if (source === 'usd' || (source === 'rate' && c.last === 'usd')) {
    const u = pm(usdIn.value);
    c.usd = usdIn.value; c.last = 'usd';
    c.uah = u == null ? '' : plain(u2k(u, r)); uahIn.value = c.uah;
  } else if (source === 'uah' || (source === 'rate' && c.last === 'uah')) {
    const k = pm(uahIn.value);
    c.uah = uahIn.value; c.last = 'uah';
    c.usd = k == null ? '' : plain(k2u(k, r)); usdIn.value = c.usd;
  }
}

/* ═════════ Файл автозбереження (Chrome / Edge) ═════════ */
const idb = () => new Promise((res, rej) => { const r = indexedDB.open('kasa3', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const idbGet = async k => { const db = await idb(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); };
const idbSet = async (k, v) => { const db = await idb(); return new Promise((res, rej) => { const q = db.transaction('kv', 'readwrite').objectStore('kv').put(v, k); q.onsuccess = () => res(); q.onerror = () => rej(q.error); }); };
const idbDel = async k => { const db = await idb(); return new Promise((res, rej) => { const q = db.transaction('kv', 'readwrite').objectStore('kv').delete(k); q.onsuccess = () => res(); q.onerror = () => rej(q.error); }); };

let writeTimer;
function scheduleFileWrite() { if (FS.status !== 'ok') return; clearTimeout(writeTimer); writeTimer = setTimeout(writeFile, 300); }
async function writeFile() {
  if (!FS.handle) return;
  try {
    const w = await FS.handle.createWritable();
    await w.write(JSON.stringify(S, null, 1));
    await w.close();
    FS.lastWrite = now(); FS.error = null;
  } catch (e) { FS.error = 'не вдалося записати файл'; FS.status = 'needs-permission'; render(); }
}
async function readFileState() {
  const f = await FS.handle.getFile(), txt = await f.text();
  if (!txt.trim()) return null;
  return parseIncoming(txt);
}
async function syncFromFile() {
  const B = await readFileState();
  if (B) {
    const st = diffStats(S, B);
    if (st.added || st.updated || st.removed || (B.supd || 0) > (S.supd || 0)) {
      S = mergeStates(S, B); persist(); render();
      if (st.added || st.updated) toast(`З файлу підтягнуто записів: ${st.added + st.updated}`);
    }
  }
  await writeFile();
}
async function initFile() {
  if (!FS.supported) return;
  try {
    const h = await idbGet('handle');
    if (!h) return;
    FS.handle = h; FS.name = h.name;
    const p = await h.queryPermission({ mode: 'readwrite' });
    if (p === 'granted') { FS.status = 'ok'; await syncFromFile(); } else FS.status = 'needs-permission';
    render();
  } catch (e) { /* працюємо без файлу */ }
}
async function connectFile() {
  try {
    const h = await window.showSaveFilePicker({ suggestedName: 'kasa-data.json', types: [{ description: 'Дані Каси (JSON)', accept: { 'application/json': ['.json'] } }] });
    FS.handle = h; FS.name = h.name;
    const existing = await readFileState();
    if (existing) {
      if (confirm('У цьому файлі вже є дані Каси.\n\nОК: об’єднати їх з поточними.\nСкасувати: перезаписати файл поточними даними.')) { S = mergeStates(S, existing); persist(); }
    }
    await idbSet('handle', h);
    FS.status = 'ok';
    await writeFile();
    render(); toast('Автозбереження увімкнено');
  } catch (e) { if (e && e.name !== 'AbortError') toast('Не вдалося підключити файл'); }
}
async function resumeFile() {
  try {
    const p = await FS.handle.requestPermission({ mode: 'readwrite' });
    if (p === 'granted') { FS.status = 'ok'; FS.error = null; await syncFromFile(); render(); toast('Автозбереження відновлено'); }
  } catch (e) { toast('Не вдалося відновити доступ до файлу'); }
}
async function disconnectFile() {
  FS.handle = null; FS.status = 'none'; FS.name = '';
  try { await idbDel('handle'); } catch (e) {}
  render(); toast('Файл відключено. Дані лишаються в браузері.');
}

/* ═════════ Хмарна синхронізація (приватний репозиторій GitHub) ═════════ */
const CLOUD_KEY = 'kasa-cloud';
const CLOUD = { cfg: null, status: 'off', err: '', last: 0, busy: false, again: false, timer: null, dirty: false, paused: false, pendingRender: false };
function loadCloud() {
  try { const c = JSON.parse(localStorage.getItem(CLOUD_KEY) || 'null'); if (c && c.repo && c.token) { CLOUD.cfg = c; CLOUD.status = 'ok'; } } catch (e) {}
}
const b64enc = str => { const bytes = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); };
const b64dec = b64 => { const bin = atob(String(b64).replace(/\s/g, '')); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); };
const ghHeaders = (extra = {}) => ({ Authorization: 'Bearer ' + CLOUD.cfg.token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...extra });
const ghFile = () => `https://api.github.com/repos/${CLOUD.cfg.repo}/contents/${CLOUD.cfg.path.split('/').map(encodeURIComponent).join('/')}`;
const ghRef = () => CLOUD.cfg.branch ? `?ref=${encodeURIComponent(CLOUD.cfg.branch)}` : '';
async function ghFetch(url, opt) {
  try { return await fetch(url, { cache: 'no-store', ...opt }); }
  catch (e) { throw Object.assign(new Error('Немає зв’язку з GitHub'), { offline: true }); }
}
function ghFail(r) {
  if (r.status === 401) return Object.assign(new Error('Токен недійсний або прострочений. Створіть новий на GitHub.'), { fatal: true });
  if (r.status === 403) return Object.assign(new Error('GitHub відмовив у доступі. Перевірте права токена (Contents: Read and write) або ліміт запитів.'), { fatal: true });
  return new Error(`Помилка GitHub (${r.status})`);
}
async function cloudGet() {
  const r = await ghFetch(ghFile() + ghRef(), { headers: ghHeaders() });
  if (r.status === 404) {
    const rr = await ghFetch(`https://api.github.com/repos/${CLOUD.cfg.repo}`, { headers: ghHeaders() });
    if (rr.status === 404) throw Object.assign(new Error('Репозиторій не знайдено, або токен не має до нього доступу.'), { fatal: true });
    if (!rr.ok) throw ghFail(rr);
    return { missing: true };
  }
  if (!r.ok) throw ghFail(r);
  const j = await r.json();
  if (j.content && j.encoding === 'base64') return { sha: j.sha, text: b64dec(j.content) };
  const raw = await ghFetch(ghFile() + ghRef(), { headers: ghHeaders({ Accept: 'application/vnd.github.raw+json' }) });
  if (!raw.ok) throw ghFail(raw);
  return { sha: j.sha, text: await raw.text() };
}
async function cloudPut(text, sha) {
  const body = { message: 'Каса: оновлення ' + new Date().toLocaleString('uk-UA'), content: b64enc(text) };
  if (sha) body.sha = sha;
  if (CLOUD.cfg.branch) body.branch = CLOUD.cfg.branch;
  const r = await ghFetch(ghFile(), { method: 'PUT', headers: ghHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify(body) });
  if (r.status === 409 || r.status === 422) throw Object.assign(new Error('conflict'), { conflict: true });
  if (!r.ok) throw ghFail(r);
}
const hasMore = (R, L) => {
  const st = diffStats(R, L);
  return !!(st.added || st.updated || st.removed || (L.supd || 0) > (R.supd || 0) || Object.keys(L.checked || {}).some(k => (L.checked[k] || 0) > ((R.checked || {})[k] || 0)));
};
function paintCloud() {
  document.querySelectorAll('[data-cloudline]').forEach(n => { n.textContent = cloudLine(); });
  document.querySelectorAll('[data-sdot]').forEach(n => { n.className = 'sdot ' + CLOUD.status; });
}
function softRender() {
  const ae = document.activeElement;
  if (dlg.open || (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && !dlg.contains(ae))) { CLOUD.pendingRender = true; return; }
  render();
}
function scheduleCloud() {
  if (!CLOUD.cfg) return;
  CLOUD.dirty = true;
  clearTimeout(CLOUD.timer);
  CLOUD.timer = setTimeout(cloudSync, 1500);
}
async function cloudSync() {
  if (!CLOUD.cfg) return;
  if (CLOUD.busy) { CLOUD.again = true; return; }
  CLOUD.busy = true; CLOUD.paused = false;
  const prev = CLOUD.status;
  CLOUD.status = 'syncing'; paintCloud();
  let changed = false;
  try {
    let done = false;
    for (let attempt = 0; attempt < 4 && !done; attempt++) {
      const remote = await cloudGet();
      let R = null;
      if (!remote.missing) {
        R = parseIncoming(remote.text);
        if (!R) throw Object.assign(new Error('Файл у репозиторії пошкоджений. Видаліть його або відновіть з історії комітів.'), { fatal: true });
        if (hasMore(S, R)) { S = mergeStates(S, R); persist(); changed = true; }
      }
      if (remote.missing || CLOUD.dirty || (R && hasMore(R, S))) {
        try { await cloudPut(JSON.stringify(S, null, 1), remote.sha); CLOUD.dirty = false; done = true; }
        catch (e) { if (!e.conflict) throw e; }
      } else done = true;
    }
    if (!done) throw new Error('Не вдалося синхронізувати через конфлікт. Спробуйте ще раз.');
    CLOUD.status = 'ok'; CLOUD.err = ''; CLOUD.last = now();
  } catch (e) {
    if (e.offline) { CLOUD.status = 'offline'; CLOUD.err = ''; }
    else { CLOUD.status = 'error'; CLOUD.err = e.message || 'Невідома помилка'; if (e.fatal) CLOUD.paused = true; }
  }
  CLOUD.busy = false;
  if (changed || (prev === 'error') !== (CLOUD.status === 'error')) softRender(); else paintCloud();
  if (CLOUD.again) { CLOUD.again = false; cloudSync(); }
}
async function cloudConnect(cfg) {
  CLOUD.cfg = cfg; CLOUD.status = 'syncing'; CLOUD.dirty = true; CLOUD.last = 0;
  try { localStorage.setItem(CLOUD_KEY, JSON.stringify(cfg)); } catch (e) {}
  await cloudSync();
  render();
  if (CLOUD.status === 'ok') toast('Хмару підключено. Дані синхронізуються автоматично');
  else if (CLOUD.status === 'error') toast(CLOUD.err);
}
function cloudDisconnect() {
  CLOUD.cfg = null; CLOUD.status = 'off'; CLOUD.err = ''; CLOUD.dirty = false;
  try { localStorage.removeItem(CLOUD_KEY); } catch (e) {}
  render(); toast('Синхронізацію вимкнено. Дані лишаються на цьому пристрої.');
}
async function copyCloudCode() {
  const c = CLOUD.cfg; if (!c) return;
  const code = 'KASA1:' + btoa(unescape(encodeURIComponent(JSON.stringify({ repo: c.repo, token: c.token, path: c.path, branch: c.branch }))));
  try { await navigator.clipboard.writeText(code); toast('Код скопійовано. Вставте його на іншому пристрої, потім видаліть з чату'); }
  catch (e) { toast('Браузер не дозволив копіювання'); }
}
setInterval(() => { if (CLOUD.cfg && !CLOUD.paused && !CLOUD.busy && document.visibilityState === 'visible') cloudSync(); }, 20000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && CLOUD.cfg && !CLOUD.paused) cloudSync(); });
window.addEventListener('online', () => { if (CLOUD.cfg) cloudSync(); });
dlg.addEventListener('close', () => { if (CLOUD.pendingRender) { CLOUD.pendingRender = false; render(); } });
document.addEventListener('focusout', () => setTimeout(() => {
  const ae = document.activeElement;
  if (CLOUD.pendingRender && !dlg.open && !(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))) { CLOUD.pendingRender = false; render(); }
}, 250));

/* ═════════ Події ═════════ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const d = el.dataset;
  switch (d.act) {
    case 'tab': ui.tab = d.tab; history.replaceState(null, '', '#' + d.tab); render(); window.scrollTo(0, 0); break;
    case 'show-debt': ui.filter = new Set([d.tag || 'debt']); ui.q = ''; ui.limit = 60; ui.tab = 'jrnl'; history.replaceState(null, '', '#jrnl'); render(); window.scrollTo(0, 0); break;
    case 'month': ui.month = shiftMonth(ui.month, Number(d.d)); render(); break;
    case 'display': S.display = d.cur; touchSettings(S); persist(); scheduleFileWrite(); scheduleCloud(); render(); break;
    case 'filter': if (d.tag === 'all') ui.filter.clear(); else if (ui.filter.has(d.tag)) ui.filter.delete(d.tag); else ui.filter.add(d.tag); ui.limit = 60; render(); break;
    case 'more-entries': ui.limit += 60; render(); break;
    case 'undo': $('#toast').hidden = true; undoLast(); break;
    case 'theme': toggleTheme(); break;
    case 'snooze': try { localStorage.setItem(SNOOZE_KEY, String(now() + 7 * DAY)); } catch (err) {} render(); break;
    case 'rate': dlgRate(); break;
    case 'close': closeDlg(); break;
    case 'adjust': dlgAdjust(d.id, d.sign); break;
    case 'exact': dlgExact(d.id); break;
    case 'debt': dlgDebt(d.mode, d.acc || 'debt'); break;
    case 'transfer': dlgTransfer(); break;
    case 'ovdp': dlgOvdp(d.mode); break;
    case 'ovdp-edit': dlgOvdpEdit(); break;
    case 'reconcile': dlgReconcile(); break;
    case 'new-entry': dlgEntry(null); break;
    case 'edit-entry': dlgEntry(d.id); break;
    case 'del-entry': { const x = S.entries.find(y => y.id === d.id); closeDlg(); commit(`Видалено «${x ? x.title : ''}»`, s => removeEntry(s, d.id), { toast: 'Запис видалено, баланси перераховано' }); break; }
    case 'add-line': { const box = $('[data-lines]', dlg); box.insertAdjacentHTML('beforeend', lineRow({ a: 'card', d: 0 })); const f = el.closest('form'); LIVE.entry(f, 'la'); const last = box.lastElementChild; if (last) last.querySelector('[name=ld]').focus(); break; }
    case 'del-line': { const f = el.closest('form'); el.closest('[data-lrow]').remove(); LIVE.entry(f, 'la'); break; }
    case 'seg': {
      const seg = el.closest('.seg'), f = el.closest('form');
      seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
      f.elements[seg.dataset.name].value = d.val;
      if (LIVE[f.dataset.form]) LIVE[f.dataset.form](f, seg.dataset.name);
      break;
    }
    case 'swap': { const f = el.closest('form'), a = f.elements.from.value; f.elements.from.value = f.elements.to.value; f.elements.to.value = a; LIVE.transfer(f, 'swap'); break; }
    case 'imp-merge': { const B = window.__imp; closeDlg(); commit('Імпорт: об’єднання', s => { Object.assign(s, mergeStates(s, B)); }, { toast: 'Дані об’єднано' }); break; }
    case 'imp-replace': { const B = window.__imp; if (!confirm('Замінити всі поточні дані даними з файлу? Це можна скасувати кнопкою «Скасувати».')) break; closeDlg(); commit('Імпорт: заміна', s => { replaceWith(s, B); }, { toast: 'Дані замінено' }); break; }
    case 'calc-quick': ui.calc.last = 'usd'; $('[data-calc=usd]').value = d.v; calcSync('usd'); break;
    case 'calc-clear': ui.calc = { usd: '', uah: '', last: 'usd' }; render(); break;
    case 'calc-rate-app': S.calcRate = S.rate; touchSettings(S); persist(); scheduleCloud(); render(); break;
    case 'calc-copy': { const u = pm(ui.calc.usd), k = pm(ui.calc.uah); if (u == null || k == null) { toast('Спершу введіть суму'); break; } const txt = `${fmt(u, 'USD')} = ${fmt(k, 'UAH')} (курс ${rateStr(S.calcRate)})`; navigator.clipboard.writeText(txt).then(() => toast('Скопійовано: ' + txt), () => toast('Браузер не дозволив копіювання')); break; }
    case 'calc-log': { const u = pm(ui.calc.usd), k = pm(ui.calc.uah); if (u == null || k == null) { toast('Спершу введіть суму'); break; } commit('Калькулятор', s => { addEntry(s, { kind: 'note', tag: 'fx', title: `Калькулятор: ${fmt(u, 'USD')} = ${fmt(k, 'UAH')}`, note: `курс ${rateStr(s.calcRate)}` }); }, { toast: 'Розрахунок записано в журнал' }); break; }
    case 'cloud': dlgCloud(); break;
    case 'cloud-sync': CLOUD.paused = false; CLOUD.dirty = true; cloudSync().then(() => { if (CLOUD.status === 'ok') toast('Синхронізовано'); }); break;
    case 'cloud-code': copyCloudCode(); break;
    case 'cloud-off': if (confirm('Вимкнути хмарну синхронізацію на цьому пристрої? Дані лишаться тут і в репозиторії.')) cloudDisconnect(); break;
    case 'file-connect': connectFile(); break;
    case 'file-resume': resumeFile(); break;
    case 'file-disconnect': disconnectFile(); break;
    case 'export': exportJson(); break;
    case 'import': $('#imp').click(); break;
    case 'share': shareData(); break;
    case 'copy-data': copyData(); break;
    case 'paste-data': dlgPaste(); break;
    case 'reset':
      if (confirm('Очистити ВСІ дані? Якщо підключена хмара, вони зникнуть і з неї. Це можна скасувати кнопкою «Скасувати» одразу після очищення.')) commit('Очищення даних', s => { replaceWith(s, normalize(blankState())); }, { toast: 'Дані очищено' });
      break;
  }
});
dlg.addEventListener('submit', e => { e.preventDefault(); const f = e.target; if (FORMS[f.dataset.form]) FORMS[f.dataset.form](f); });
dlg.addEventListener('input', e => { const f = e.target.closest('form'); if (f && LIVE[f.dataset.form]) LIVE[f.dataset.form](f, e.target.name || ''); });
dlg.addEventListener('change', e => { const f = e.target.closest('form'); if (f && LIVE[f.dataset.form] && e.target.tagName === 'SELECT') LIVE[f.dataset.form](f, e.target.name || ''); });

/* калькулятор та пошук: оновлення «на льоту» без перемальовування */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.calc) {
    if (t.dataset.calc === 'rate') {
      const r = prate(t.value);
      if (r && r >= 10000) { S.calcRate = r; touchSettings(S); persist(); scheduleFileWrite(); scheduleCloud(); calcSync('rate'); }
    } else calcSync(t.dataset.calc);
  }
  if (t.dataset && t.dataset.bind === 'q') {
    ui.q = t.value; ui.limit = 60;
    const pos = t.selectionStart;
    render();
    const n = document.querySelector('[data-bind=q]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (err) {} }
  }
});

window.addEventListener('hashchange', () => { ui.tab = location.hash.slice(1) || 'home'; render(); });
window.addEventListener('storage', e => { if (e.key === KEY && e.newValue) { try { const d = JSON.parse(e.newValue); if (validV3(d)) { S = normalize(d); render(); } } catch (err) {} } });

/* ═════════ Старт ═════════ */
applyThemeColor();
S = load();
undo = loadUndo();
persist();
loadCloud();
ui.tab = location.hash.slice(1) || 'home';
render();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
initFile();
if (CLOUD.cfg) cloudSync();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('./sw.js').catch(() => {});
})();
</script>
